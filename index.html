<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শুভ দীপাবলি</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600&display=swap');
* {margin:0;padding:0;box-sizing:border-box;}
body {background:#0b0f19;font-family:'Hind Siliguri',sans-serif;color:#fff;text-align:center;overflow:hidden;height:100vh;}
#stars, #fireworks {position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;}
.container {position:relative;top:8%;display:none;width:90%;max-width:800px;margin:0 auto;}
#greeting {font-size:clamp(1.5rem,4vw,3rem);color:#ffd700;text-shadow:0 0 20px #ffcc00,0 0 40px #ffaa00;animation:glow 2s ease-in-out infinite alternate;}
@keyframes glow {from{ text-shadow:0 0 10px #ff9900;}to{ text-shadow:0 0 30px #ffcc00,0 0 50px #ffaa00;}}
.name-box {margin:2vh 0;}
#nameInput {width:80%;max-width:300px;padding:0.8em 1em;border-radius:8px;border:none;outline:none;font-size:clamp(0.9rem,2vw,1.2rem);}
.diyas {display:flex;justify-content:center;gap:5vw;margin-top:4vh;flex-wrap:wrap;}
.diya {position:relative;width:clamp(60px,10vw,100px);height:clamp(60px,10vw,100px);cursor:pointer;}
.pot {position:absolute;bottom:0;width:100%;height:50%;background:#cc6600;border-radius:0 0 50% 50%;border-top:0.4em solid #aa5500;}
.flame {position:absolute;bottom:55%;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:25px solid #ffcc00;opacity:0;border-radius:50%;transition:opacity 0.5s ease;}
.diya.light-on .flame {opacity:1;animation:pulse 1.5s infinite alternate;box-shadow:0 0 30px 10px rgba(255,153,0,0.8),0 0 60px 20px rgba(255,102,0,0.5);}
@keyframes pulse {from{transform:translateX(-50%) scale(1);}to{transform:translateX(-50%) scale(1.05);}}
.buttons {margin-top:4vh;display:flex;justify-content:center;gap:5vw;flex-wrap:wrap;}
button {padding:0.8em 1.5em;font-size:clamp(0.9rem,2vw,1.1rem);border:none;border-radius:8px;background:#ff6600;color:white;cursor:pointer;transition:0.3s;}
button:hover {background:#cc5500;}
.rangoli {position:fixed;bottom:0;left:0;width:100%;height:clamp(100px,20vh,150px);background:radial-gradient(circle at center,#ffb347,#ffcc33,transparent);opacity:0.2;z-index:-1;}
#welcome-screen {position:fixed;top:0;left:0;width:100%;height:100%;background:#0b0f19;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:100;color:#ffd700;padding:2vw;}
#welcome-screen h1 {font-size:clamp(2rem,6vw,3em);margin-bottom:2vh;text-shadow:0 0 20px #ffcc00;}
</style>
</head>
<body>

<div id="welcome-screen">
    <h1>শুভ দীপাবলি! 🎆</h1>
    <button id="start-button">শুরু করুন</button>
</div>

<canvas id="stars"></canvas>
<canvas id="fireworks"></canvas>

<div class="container" id="main-container">
    <h1 id="greeting">প্রদীপটি জ্বালাও!</h1>

    <div class="name-box">
        <input type="text" id="nameInput" placeholder="তোমার নাম লিখো...">
    </div>

    <div class="diyas">
        <div class="diya"><div class="flame"></div><div class="pot"></div></div>
        <div class="diya"><div class="flame"></div><div class="pot"></div></div>
        <div class="diya"><div class="flame"></div><div class="pot"></div></div>
    </div>

    <div class="buttons">
        <button id="light-button">প্রজ্বলিত করুন</button>
        <button id="share-button">📤 শেয়ার করুন</button>
    </div>

    <audio id="music" src="https://raw.githubusercontent.com/aritrobhattacharjee12-creator/Happy-Diwali-2025/main/Loud%20Fireworks%20(Bass%20Boosted).mp3" loop></audio>
</div>

<div class="rangoli"></div>

<script>
// ===== CANVAS SETUP =====
const canvas=document.getElementById('stars'), ctx=canvas.getContext('2d');
const fwCanvas=document.getElementById('fireworks'), fwCtx=fwCanvas.getContext('2d');
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;fwCanvas.width=window.innerWidth;fwCanvas.height=window.innerHeight;}
window.addEventListener('resize',resizeCanvas); resizeCanvas();

// ===== STARS =====
let stars=[]; for(let i=0;i<200;i++) stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.5,d:Math.random()});
function drawStars(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#fff";stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,2*Math.PI);ctx.fill();}); moveStars();}
function moveStars(){stars.forEach(s=>{s.y+=0.15+s.d*0.3;if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;}});}
setInterval(drawStars,50);

// ===== FIREWORKS =====
let fireworks=[], intensityMultiplier=1;
class Particle{constructor(x,y,color,size=2,velMultiplier=1){this.x=x;this.y=y;this.color=color;this.alpha=1;this.size=size;const angle=Math.random()*2*Math.PI;const speed=(Math.random()*5+2)*velMultiplier;this.velX=Math.cos(angle)*speed;this.velY=Math.sin(angle)*speed;this.gravity=0.05;}
update(){this.velY+=this.gravity;this.x+=this.velX;this.y+=this.velY;this.alpha-=0.02;}
draw(){fwCtx.globalAlpha=this.alpha;fwCtx.fillStyle=this.color;fwCtx.beginPath();fwCtx.arc(this.x,this.y,this.size,0,2*Math.PI);fwCtx.fill();}}
function spawnFirework(x=Math.random()*fwCanvas.width,y=Math.random()*fwCanvas.height*0.5,extra=false){let colors=['#ff0','#f00','#0ff','#0f0','#f0f','#ffa500','#00f','#ff69b4','#adff2f'];let count=extra?80*intensityMultiplier:50*intensityMultiplier;for(let i=0;i<count;i++){let size=Math.random()*2+1;fireworks.push(new Particle(x,y,colors[Math.floor(Math.random()*colors.length)],size,intensityMultiplier));}}
function animateFireworks(){fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);for(let i=fireworks.length-1;i>=0;i--){const p=fireworks[i];p.update();p.draw();if(p.alpha<=0)fireworks.splice(i,1);}requestAnimationFrame(animateFireworks);}
animateFireworks(); setInterval(()=>spawnFirework(),1500);
fwCanvas.addEventListener('click', e=>spawnFirework(e.clientX,e.clientY,true));
fwCanvas.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.touches[0]; spawnFirework(t.clientX,t.clientY,true);});

// ===== DIYAS & INTERACTIONS =====
const diyas=document.querySelectorAll('.diya'), greeting=document.getElementById('greeting');
const lightButton=document.getElementById('light-button'), shareButton=document.getElementById('share-button');
const nameInput=document.getElementById('nameInput');
const mainContainer=document.getElementById('main-container'), welcomeScreen=document.getElementById('welcome-screen');
const startButton=document.getElementById('start-button'), music=document.getElementById('music');
let isLit=false, flickerInterval=false;

// CAPITALIZE FIRST LETTER
function capitalizeFirstLetter(name){ return name?name.charAt(0).toUpperCase()+name.slice(1):''; }

// START BUTTON
startButton.addEventListener('click',()=>{
    welcomeScreen.style.display='none';
    mainContainer.style.display='block';
    if(music.paused) music.play();
});

// LIGHT TOGGLE
function toggleDiyas(){
    isLit=!isLit; diyas.forEach(d=>d.classList.toggle('light-on',isLit));
    intensityMultiplier=isLit?1.5:1; let userName=capitalizeFirstLetter(nameInput.value.trim());
    if(isLit){
        greeting.textContent=`শুভ দীপাবলি ${userName}! ✨`;
        lightButton.textContent="নিভিয়ে দিন";
        startFlameFlicker();
        spawnFirework(); spawnFirework(); spawnFirework();
        if(music.paused) music.play();
        navigator.vibrate?.(200);
    }else{
        greeting.textContent="প্রদীপটি জ্বালাও!";
        lightButton.textContent="প্রজ্বলিত করুন";
        stopFlameFlicker();
        music.pause();
    }
}
lightButton.addEventListener('click',toggleDiyas);
diyas.forEach(d=>d.addEventListener('click',toggleDiyas));

// SHARE BUTTON VISIBILITY
shareButton.style.display='none';
nameInput.addEventListener('input',()=>{
    if(nameInput.value.trim()!=='') shareButton.style.display='inline-block'; 
    else shareButton.style.display='none';
});

// SHARE FUNCTION (Updated: GitHub link removed)
shareButton.addEventListener('click', ()=>{
    const userName = capitalizeFirstLetter(nameInput.value.trim());
    const text = `🎆 শুভ দীপাবলি ${userName}! 🪔 আলোয় ভরে উঠুক জীবন 🌟`;

    const whatsappURL = `https://wa.me/?text=${encodeURIComponent(text)}`; 

    if(/Mobi|Android/i.test(navigator.userAgent)){ 
        location.href = whatsappURL; 
    }
    else if(navigator.share){ 
        navigator.share({
            title: 'শুভ দীপাবলি',
            text: text
            // url: window.location.href → এই লাইন মুছে দেওয়া হলো
        }).catch(()=>manualCopy(text)); 
    }
    else { 
        manualCopy(text); 
    }
});

// MANUAL COPY
function manualCopy(text){ const textarea=document.createElement('textarea'); textarea.value=text; document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); document.body.removeChild(textarea); alert('শুভেচ্ছা কপি করা হয়েছে! এখন আপনি এটি শেয়ার করতে পারেন।'); }

// FLAME FLICKER
function startFlameFlicker(){ flickerInterval=setInterval(()=>{ diyas.forEach(d=>{ const f=d.querySelector('.flame'); if(f){ const scale=1+Math.random()*0.15; const rotate=(Math.random()-0.5)*15; f.style.transform=`translateX(-50%) scale(${scale}) rotate(${rotate}deg)`; f.style.borderBottomColor=`rgb(255,${150+Math.floor(Math.random()*105)},0)`; } }); },100); }
function stopFlameFlicker(){ clearInterval(flickerInterval); }
</script>
</body>
</html>
